[package]
name = "interview-coach"
version = "0.1.2"
edition = "2021"
description = "面试教练 - 单机版(Rust 实现, 无用户体系, 接入可配置大模型)"

[dependencies]
axum = { version = "0.7.9", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "sync", "net", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures-util = "0.3.34"
futures = "0.3.34"
async-stream = "0.3.6"
tower-http = { version = "0.6.11", features = ["cors", "trace", "fs"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
thiserror = "2.0.20"
http = "1.5.0"
toml = "0.8.23"
chrono = { version = "0.4.42", features = ["serde"] }
parking_lot = "0.12.5"
flate2 = "1.1.5"
dotenvy = "0.15.7"
encoding_rs = "0.8.41"
pdf-extract = "0.12.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[profile.release]
lto = "thin"
