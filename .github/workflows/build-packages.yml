name: 构建便携包(Windows / Linux / macOS)

# 两种触发方式:
# 1) 手动 Run workflow:只构建,产物在本次运行的 Artifacts 里下载;
#    若填了 release_tag(如 v0.1.0),构建成功后还会自动发布 Release。
# 2) 推一个 v* 标签:构建成功后自动发布 Release。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布为 Release 的标签(如 v0.1.0;留空则只构建不发布)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译(release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: 冒烟测试(Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BIN: target/${{ matrix.target }}/release/interview-coach
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ic-data"
          "$BIN" --help > /dev/null
          "$BIN" --no-browser --port 8231 \
            --data-dir "$RUNNER_TEMP/ic-data" \
            --config "$RUNNER_TEMP/ic-data/config.toml" > "$RUNNER_TEMP/ic.log" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8231/api/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [[ -z "$ok" ]]; then
            echo "服务未在 30 秒内就绪,日志:" >&2
            cat "$RUNNER_TEMP/ic.log" >&2 || true
            exit 1
          fi
          echo "冒烟测试通过"

      - name: 冒烟测试(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/interview-coach.exe"
          $data = Join-Path $env:RUNNER_TEMP "ic-data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          & $bin --help | Out-Null
          $proc = Start-Process -FilePath $bin -WindowStyle Hidden -PassThru -ArgumentList @(
            "--no-browser", "--port", "8231",
            "--data-dir", $data,
            "--config", (Join-Path $data "config.toml")
          )
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $null = Invoke-RestMethod -Uri "http://127.0.0.1:8231/api/health" -TimeoutSec 3
              $ok = $true
              break
            }
            catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "服务未在 30 秒内就绪" }
          Write-Host "冒烟测试通过"

      - name: 打包(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/make-dist.ps1 `
            -ExePath "target/${{ matrix.target }}/release/interview-coach.exe" `
            -Name "interview-coach-${{ matrix.platform }}" `
            -OutDir dist
          if (-not (Test-Path "dist/interview-coach-${{ matrix.platform }}/web/index.html")) {
            throw "包内缺少 web/index.html"
          }

      - name: 打包(Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # 打包脚本打印每条命令,失败时日志能直接指到出错的命令
          IC_DIST_DEBUG: "1"
        run: |
          set -euo pipefail
          archive="dist/interview-coach-${{ matrix.platform }}.tar.gz"
          echo "工作目录: $(pwd)"
          df -h . || true
          bash tools/make-dist.sh \
            "target/${{ matrix.target }}/release/interview-coach" \
            "interview-coach-${{ matrix.platform }}"
          if [[ ! -s "$archive" ]]; then
            echo "没有生成压缩包: $archive" >&2
            ls -l dist >&2 || true
            exit 1
          fi
          # 直接解包再校验文件,比解析 tar 清单直观,也避开管道相关的坑
          rm -rf "$RUNNER_TEMP/pkgcheck"
          mkdir -p "$RUNNER_TEMP/pkgcheck"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pkgcheck"
          pkg="$RUNNER_TEMP/pkgcheck/interview-coach-${{ matrix.platform }}"
          test -f "$pkg/web/index.html"
          test -x "$pkg/interview-coach"
          test -f "$pkg/start.sh"
          ls -lh "$archive"

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: interview-coach-release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # 四个平台都成功后才发布,避免发出「缺平台」的 Release
  release:
    name: 发布 Release
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载三平台制品
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理文件名
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          for f in artifacts/*.zip artifacts/*.tar.gz; do
            [[ -e "$f" ]] || continue
            base="$(basename "$f")"
            if [[ "$base" == *.tar.gz ]]; then
              name="${base%.tar.gz}"
              ext="tar.gz"
            else
              name="${base%.*}"
              ext="${base##*.}"
            fi
            cp "$f" "release/${name}-${TAG}.${ext}"
          done
          ls -lh release
          count="$(ls -1 release | wc -l)"
          if [[ "$count" -ne 4 ]]; then
            echo "期望 4 个平台包,实际 $count 个" >&2
            exit 1
          fi

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          gh --version
          echo "仓库=$GITHUB_REPOSITORY 标签=$TAG 事件=${{ github.event_name }}"
          notes="面试教练 · 单机版($TAG)

          - Windows x64:解压后双击 启动面试教练.cmd
          - Linux x64 / macOS:解压后 chmod +x interview-coach start.sh,再运行 ./start.sh
          - macOS 未签名,首次打开需右键「打开」,或执行 xattr -dr com.apple.quarantine 该目录
          - 首次使用在页面右上角「设置」里填大模型 Base URL / API Key / 模型名"

          # 先探一次写权限:有权限时缺 tag_name 会返回 422,没权限则是 403
          write_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" -d '{}' || echo 000)"
          echo "写权限探测(releases):HTTP $write_code(422=有权限,403=权限不足)"
          if [[ "$write_code" == "403" ]]; then
            echo "GITHUB_TOKEN 无法写仓库:请到 仓库 Settings -> Actions -> General -> Workflow permissions 选择 Read and write permissions" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            # 标签已存在(推标签触发,或手动填的标签早已打过)
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
